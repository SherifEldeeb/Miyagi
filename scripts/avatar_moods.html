<!doctype html>
<!-- Mood sheet for avatar.js: every mood side by side. Open it from a local server at the repo root
     (uv run python -m http.server 8001, then http://localhost:8001/scripts/avatar_moods.html).
     Query: ?t=1.3 freezes the animation at that time; ?sev=1..3 sets the severity; ?r=44 the head
     radius; ?cols=8 the moods per row.
     docs/miyagi-moods.png is a headless Chrome screenshot of ?t=1.3&sev=1 (see DESIGN §9). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mr. Miyagi moods</title>
  <style>
    html, body { margin: 0; background: #F0F4F9; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="sheet"></canvas>
  <script src="../miyagi/static/avatar.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const frozen = q.has("t") ? Number(q.get("t")) : null;
    const sev = Number(q.get("sev") || 1), r = Number(q.get("r") || 44);
    const moods = window.AVATAR_MOODS, cols = Number(q.get("cols") || 8), cw = r * 3.4, ch = r * 4.4;
    const cv = document.getElementById("sheet"), dpr = window.devicePixelRatio || 1;
    const W = cols * cw, H = Math.ceil(moods.length / cols) * ch;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
    const c = cv.getContext("2d");
    function frame(now) {
      const t = frozen ?? now / 1000;
      c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
      moods.forEach((m, i) => {
        const x = (i % cols) * cw + cw / 2, y = Math.floor(i / cols) * ch + r * 1.85;
        window.drawAvatar(c, x, y, r, m, t, sev);
        c.fillStyle = "#444746"; c.font = `500 ${Math.round(r * 0.3)}px system-ui, sans-serif`;
        c.textAlign = "center"; c.fillText(m, x, y + r * 2.25);
      });
      if (frozen === null) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
