[project]
name = "miyagi-coach"
version = "0.1.0"
description = "A private, local-first meeting coach with pluggable AI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pillow>=11,<13", "numpy>=1.26,<3", "python-dotenv>=1,<2",
  "mediapipe>=0.10.21,<0.11",
  "google-genai>=1.30,<2", "openai>=1.75,<3", "anthropic[vertex]>=0.50,<1",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.6,<2", "skl2onnx>=1.18,<2", "onnxruntime>=1.20,<2"]
onnx = ["onnxruntime>=1.20,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
miyagi = "miyagi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miyagi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
