[project]
name = "meeting-coach"
version = "0.1.0"
description = "Real-time, on-device coaching for unconscious habits during video meetings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mediapipe>=0.10.20",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    # Default LLM backend for the coaching report (Gemini API key or Vertex AI ADC).
    "google-genai>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
openai = ["openai>=1.40"]
all-llms = ["anthropic>=0.70", "openai>=1.40"]

[project.scripts]
meeting-coach = "meeting_coach.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeting_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E702", "E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["meeting_coach"]
known-local-folder = ["synth"]
